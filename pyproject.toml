[project]
name = "benthic-habitat-segmentation"
version = "0.1.0"
description = "Semantic segmentation of benthic habitats in 8-band WorldView-3 imagery using SMP UNet."
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3,<2.0",
    "matplotlib>=3.8",
    "numpy>=1.26,<2.0",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "rasterio>=1.3.9",
    "scikit-learn>=1.4",
    "segmentation-models-pytorch==0.3.4",
    "torch>=2.2.0,<2.5.0",
    "torchvision>=0.17.0,<0.20.0",
    "tqdm>=4.66",
]
